name: Release

on:
  push:
    tags:
      - "*.*.*" # 1.2.3

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create GitHub Release via gh
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "v$TAG" --generate-notes --fail-on-no-commits --draft

  docker:
    needs: [release]
    strategy:
      matrix:
        include:
          - tag: server-csharp
            dockerfile: csharp/src/InMemoryServer/Dockerfile
            context: ./csharp
          - tag: client-csharp
            dockerfile: csharp/src/CliClient/Dockerfile
            context: ./csharp
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/to-lower@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        id: lower
        with:
          value: ${{ matrix.tag }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.lower.outputs.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest-${{ matrix.tag }}
            type=raw,value=${{ github.ref_name }}-${{ matrix.tag }}
            type=sha,enable=true,priority=100,suffix=-${{ matrix.tag }},format=short
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.SYNCED_DOCKER_USER }}
          password: ${{ secrets.SYNCED_DOCKER_PASS }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          file: "${{ matrix.dockerfile }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: "${{ matrix.context }}"
